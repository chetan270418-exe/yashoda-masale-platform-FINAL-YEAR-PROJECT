# Staging Docker Compose Specification (Milestone M9 / T-090)
# Yashoda SpiceChain Production-Grade Staging Topology
#
# Features:
# - PostgreSQL 16 database with health check & persistent volume
# - Backend FastAPI monolithic service with multi-worker Uvicorn
# - Automatic HTTPS / TLS reverse proxy via Caddy
# - Isolated internal network with external HTTPS ingress on port 80/443
# - Environment secrets segregation via .env.staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yashoda_masale_staging}
      POSTGRES_USER: ${POSTGRES_USER:-yashoda_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./backend/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yashoda_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yashoda_masale_staging}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for staging}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 120
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.yashodamasale.com,http://localhost:3000}
      APP_NAME: "Yashoda SpiceChain [Staging]"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.yashodamasale.com}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_staging_data:
  caddy_data:
  caddy_config:
